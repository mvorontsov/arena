services:
  rosctl:
    build: .
    image: rosctl:latest
    ports:
      - "8000:8000"
    volumes:
      - ./inventory.yml:/app/inventory.yml
      - ./inventory.example.yml:/app/inventory.example.yml
      - ./backups:/app/backups
      - ./templates:/app/templates
      - ./playbooks:/app/playbooks
    environment:
      - ROS_DEMO=1
      - ROS_INVENTORY_PATH=/app/inventory.yml
    command: rosctl serve --host 0.0.0.0 --port 8000
    restart: unless-stopped
