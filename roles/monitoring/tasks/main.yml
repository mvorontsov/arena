---
# roles/monitoring/tasks/main.yml — настройка роутера для сбора в Prometheus

- name: Включить accounting
  community.routeros.api:
    hostname: "{{ hostname | default(api_hostname) }}"
    username: "{{ username | default(api_username) }}"
    password: "{{ password | default(api_password) }}"
    port: "{{ api_port | default(8728) }}"
    path: "ip accounting"
    add: "enabled=yes account-local-traffic=no threshold=256"
  failed_when: false
  tags: [monitoring]

- name: Настроить remote logging
  community.routeros.api:
    hostname: "{{ hostname | default(api_hostname) }}"
    username: "{{ username | default(api_username) }}"
    password: "{{ password | default(api_password) }}"
    port: "{{ api_port | default(8728) }}"
    path: "system logging action"
    add: "name=remote target=remote remote={{ monitoring.syslog_remote | default('192.168.0.10') }} remote-port={{ monitoring.syslog_port | default(514) }}"
  failed_when: false
  tags: [monitoring, logging]

- name: Вывод — как Prometheus собирает метрики
  ansible.builtin.debug:
    msg: |
      Мониторинг {{ inventory_hostname }} → Prometheus:
      - Mock API: {{ hostname | default(api_hostname) }}:8728
      - Pushgateway audit: {{ audit_prometheus_pushgateway | default('http://192.168.0.10:9091') }}
      Grafana dashboard: monitoring/grafana/dashboards/mikrotik-audit.json
  tags: [monitoring]
