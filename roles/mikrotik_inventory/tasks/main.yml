---
# roles/mikrotik_inventory/tasks/main.yml
# Инвентаризация: собираем сырые факты с роутера и сохраняем в hostvars + отчёт

- name: Создать директорию для фактов
  ansible.builtin.file:
    path: "{{ inventory_output_dir | default('./reports/facts') }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: false
  tags: [inventory]

- name: Собрать факты — system resource
  community.routeros.api_find:
    path: system resource
  register: fact_resource
  failed_when: false
  tags: [inventory]

- name: Собрать факты — system identity
  community.routeros.api_find:
    path: system identity
  register: fact_identity
  failed_when: false
  tags: [inventory]

- name: Собрать факты — system clock
  community.routeros.api_find:
    path: system clock
  register: fact_clock
  failed_when: false
  tags: [inventory]

- name: Собрать факты — system routerboard
  community.routeros.api_find:
    path: system routerboard
  register: fact_routerboard
  failed_when: false
  tags: [inventory]

- name: Собрать факты — ip address
  community.routeros.api_find:
    path: ip address
  register: fact_addresses
  failed_when: false
  tags: [inventory]

- name: Собрать факты — interface (bridge, ether)
  community.routeros.api_find:
    path: interface
  register: fact_interfaces
  failed_when: false
  tags: [inventory]

- name: Собрать факты — interface bridge port
  community.routeros.api_find:
    path: interface bridge port
  register: fact_bridge_ports
  failed_when: false
  tags: [inventory]

- name: Собрать факты — ip route
  community.routeros.api_find:
    path: ip route
  register: fact_routes
  failed_when: false
  tags: [inventory]

- name: Собрать факты — ip firewall filter
  community.routeros.api_find:
    path: ip firewall filter
  register: fact_fw_filter
  failed_when: false
  tags: [inventory]

- name: Собрать факты — ip firewall nat
  community.routeros.api_find:
    path: ip firewall nat
  register: fact_fw_nat
  failed_when: false
  tags: [inventory]

- name: Собрать факты — ip service
  community.routeros.api_find:
    path: ip service
  register: fact_services
  failed_when: false
  tags: [inventory]

- name: Собрать факты — ip dns
  community.routeros.api_find:
    path: ip dns
  register: fact_dns
  failed_when: false
  tags: [inventory]

- name: Собрать факты — ip dhcp-server
  community.routeros.api_find:
    path: ip dhcp-server
  register: fact_dhcp_server
  failed_when: false
  tags: [inventory]

- name: Собрать факты — user (учётки)
  community.routeros.api_find:
    path: user
  register: fact_users
  failed_when: false
  tags: [inventory]

- name: Собрать факты — system ntp client
  community.routeros.api_find:
    path: system ntp client
  register: fact_ntp
  failed_when: false
  tags: [inventory]

- name: Собрать факты — ip neighbor discovery
  community.routeros.api_find:
    path: ip neighbor discovery-settings
  register: fact_discovery
  failed_when: false
  tags: [inventory]

# --- Нормализация и сохранение ---

- name: Собрать все факты в единую структуру
  ansible.builtin.set_fact:
    mikrotik_facts:
      meta:
        hostname: "{{ inventory_hostname }}"
        ansible_host: "{{ ansible_host }}"
        collected_at: "{{ ansible_date_time.iso8601 | default(now()) }}"
        routeros_version: "{{ fact_resource.version | default('unknown') }}"
        board: "{{ fact_resource['board-name'] | default('unknown') }}"
        architecture: "{{ fact_resource['architecture-name'] | default('') }}"
      identity: "{{ fact_identity if fact_identity is success else {} }}"
      resource: "{{ fact_resource if fact_resource is success else {} }}"
      clock: "{{ fact_clock if fact_clock is success else {} }}"
      routerboard: "{{ fact_routerboard if fact_routerboard is success else {} }}"
      addresses: "{{ fact_addresses if fact_addresses is success else [] }}"
      interfaces: "{{ fact_interfaces if fact_interfaces is success else [] }}"
      bridge_ports: "{{ fact_bridge_ports if fact_bridge_ports is success else [] }}"
      routes: "{{ fact_routes if fact_routes is success else [] }}"
      firewall_filter: "{{ fact_fw_filter if fact_fw_filter is success else [] }}"
      firewall_nat: "{{ fact_fw_nat if fact_fw_nat is success else [] }}"
      services: "{{ fact_services if fact_services is success else [] }}"
      dns: "{{ fact_dns if fact_dns is success else {} }}"
      dhcp: "{{ fact_dhcp_server if fact_dhcp_server is success else [] }}"
      users: "{{ fact_users if fact_users is success else [] }}"
      ntp: "{{ fact_ntp if fact_ntp is success else {} }}"
      discovery: "{{ fact_discovery if fact_discovery is success else {} }}"
    cacheable: true
  tags: [inventory]

- name: Сохранить факты на контроллер (JSON) — для Grafana/Prometheus
  ansible.builtin.copy:
    content: "{{ mikrotik_facts | to_nice_json(indent=2) }}"
    dest: "{{ inventory_output_dir | default('./reports/facts') }}/{{ inventory_hostname }}.json"
    mode: "0644"
  delegate_to: localhost
  tags: [inventory]

- name: Сохранить inventory-снимок (для последующего аудита)
  ansible.builtin.copy:
    content: |
      # {{ inventory_hostname }} — {{ ansible_host }} — {{ mikrotik_facts.meta.collected_at }}
      # ROS {{ mikrotik_facts.meta.routeros_version }} — {{ mikrotik_facts.meta.board }}
      addresses: {{ mikrotik_facts.addresses | to_json }}
      bridge_ports: {{ mikrotik_facts.bridge_ports | to_json }}
      firewall_filter_rules: {{ mikrotik_facts.firewall_filter | length }}
      nat_rules: {{ mikrotik_facts.firewall_nat | length }}
      services: {{ mikrotik_facts.services | to_json }}
      users: {{ mikrotik_facts.users | map(attribute='name') | list | to_json }}
    dest: "{{ inventory_output_dir | default('./reports/facts') }}/{{ inventory_hostname }}.yml"
    mode: "0644"
  delegate_to: localhost
  tags: [inventory]

- name: Краткий вывод инвентаризации
  ansible.builtin.debug:
    msg: |
      [{{ inventory_hostname }}] {{ ansible_host }} — {{ mikrotik_facts.meta.board }} / ROS {{ mikrotik_facts.meta.routeros_version }}
      IP: {{ mikrotik_facts.addresses | map(attribute='address') | list | join(', ') }}
      Bridge ports: {{ mikrotik_facts.bridge_ports | map(attribute='interface') | list | join(', ') }}
      FW filter: {{ mikrotik_facts.firewall_filter | length }} rules, NAT: {{ mikrotik_facts.firewall_nat | length }}
      Users: {{ mikrotik_facts.users | map(attribute='name') | list | join(', ') }}
  tags: [inventory]
