---
# roles/mikrotik_bootstrap/tasks/main.yml
# Задача: подключиться к роутеру (admin), создать тех.учётку, проверить, настроить API-SSL

- name: Проверка API-доступности (RouterOS 7.25, API порт {{ ansible_port }})
  community.routeros.api_find:
    path: system resource
  register: res_resource
  failed_when: false
  tags: [bootstrap, check]

- name: Вывод версии RouterOS (факт)
  ansible.builtin.debug:
    msg: >-
      Board {{ res_resource['board-name'] | default('unknown') }},
      ROS {{ res_resource['version'] | default('unknown') }},
      Uptime {{ res_resource['uptime'] | default('') }}
  when: res_resource is success and not res_resource.failed | default(false)
  tags: [bootstrap, check]

- name: Предупреждение — роутер недоступен (стенд?)
  ansible.builtin.debug:
    msg: >
      [STAND] Роутер {{ inventory_hostname }} ({{ ansible_host }}) недоступен —
      проверьте VPN/LAN 192.168.0.0/16, API включён: /ip service print
      Ошибка: {{ res_resource.msg | default(res_resource) }}
  when: res_resource.failed | default(false)
  tags: [bootstrap, check]

# --- Пользователь ---
- name: Проверить существование тех.учётки {{ tech_user }}
  community.routeros.api_find:
    path: user
    filter:
      name: "{{ tech_user }}"
  register: existing_user
  when: not (res_resource.failed | default(false))
  tags: [bootstrap, user]

- name: Создать тех.учётку {{ tech_user }} (group={{ tech_user_group }})
  community.routeros.api_modify:
    path: user
    data:
      - name: "{{ tech_user }}"
        group: "{{ tech_user_group }}"
        password: "{{ tech_user_password }}"
        address: "{{ tech_user_allowed_address }}"
        comment: "{{ tech_user_comment }}"
  when:
    - not (res_resource.failed | default(false))
    - existing_user is defined
    - existing_user | length == 0
  no_log: true
  notify: Сохранить конфигурацию
  tags: [bootstrap, user]

- name: Обновить тех.учётку, если уже есть и force
  community.routeros.api_modify:
    path: user
    data:
      - name: "{{ tech_user }}"
        group: "{{ tech_user_group }}"
        address: "{{ tech_user_allowed_address }}"
        comment: "{{ tech_user_comment }}"
  when:
    - not (res_resource.failed | default(false))
    - existing_user is defined
    - existing_user | length > 0
    - tech_user_force | default(false) | bool
  no_log: true
  tags: [bootstrap, user]

- name: Задать SSH-ключ для тех.учётки (если указан)
  community.routeros.api_modify:
    path: user ssh-keys
    data:
      - user: "{{ tech_user }}"
        key: "{{ tech_user_ssh_pubkey }}"
  when:
    - tech_user_ssh_pubkey | length > 0
    - not (res_resource.failed | default(false))
  tags: [bootstrap, user]

# --- Сервис API ---
- name: Включить API-SSL и ограничить доступом из LAN
  community.routeros.api_modify:
    path: ip service
    data:
      - name: api-ssl
        port: 8729
        address: "{{ tech_user_allowed_address }}"
        disabled: false
      - name: api
        disabled: true
  when: not (res_resource.failed | default(false))
  tags: [bootstrap, service]

- name: Отключить небезопасные сервисы (telnet, ftp, www)
  community.routeros.api_modify:
    path: ip service
    data:
      - name: telnet
        disabled: true
      - name: ftp
        disabled: true
      - name: www
        disabled: true
  when: not (res_resource.failed | default(false))
  tags: [bootstrap, service]

- name: Включить SSH strong-crypto
  community.routeros.api_modify:
    path: ip ssh
    data:
      - strong-crypto: true
        forwarding-enabled: false
  when: not (res_resource.failed | default(false))
  tags: [bootstrap, service]

# --- Проверка новой учётки ---
- name: Проверка подключения новой учёткой (если verify)
  community.routeros.api_find:
    path: system identity
  vars:
    ansible_user: "{{ tech_user }}"
    ansible_password: "{{ tech_user_password }}"
    ansible_port: 8729
    ansible_api_use_ssl: true
  register: verify_new
  failed_when: false
  when:
    - bootstrap_verify | bool
    - not (res_resource.failed | default(false))
    - existing_user is defined and existing_user | length == 0
  tags: [bootstrap, verify]

- name: Результат проверки новой учётки
  ansible.builtin.debug:
    msg: "✓ Тех.учётка {{ tech_user }} работает: identity={{ verify_new['name'] | default('unknown') }}"
  when:
    - verify_new is defined
    - verify_new is success
  tags: [bootstrap, verify]

- name: Сохранить факты bootstrap
  ansible.builtin.set_fact:
    bootstrap_ok: "{{ not (res_resource.failed | default(false)) }}"
    bootstrap_user_created: "{{ existing_user is defined and existing_user | length == 0 }}"
    cacheable: true
  tags: [bootstrap]
