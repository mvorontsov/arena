---
# roles/mikrotik_baseline/tasks/main.yml
# Эталонный конфиг хранится в config/baseline/, раскатывается на флот

- name: Проверить наличие эталонного конфига
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../{{ baseline_dir }}/{{ baseline_file_rsc }}"
  delegate_to: localhost
  register: baseline_stat
  tags: [baseline, check]

- name: Уведомить, если эталона нет
  ansible.builtin.debug:
    msg: "Эталон {{ baseline_dir }}/{{ baseline_file_rsc }} не найден — создайте его"
  when: not baseline_stat.stat.exists
  tags: [baseline]

- name: Загрузить эталонный RSC
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../{{ baseline_dir }}/{{ baseline_file_rsc }}"
  delegate_to: localhost
  register: baseline_rsc_raw
  when: baseline_stat.stat.exists
  tags: [baseline]

- name: Создать бэкап текущего export (через API)
  community.routeros.api:
    hostname: "{{ hostname | default(api_hostname) }}"
    username: "{{ username | default(api_username) }}"
    password: "{{ password | default(api_password) }}"
    port: "{{ api_port | default(8728) }}"
    path: "export"
    cmd: ""
  register: current_export
  failed_when: false
  when: baseline_backup_before | bool
  tags: [baseline, backup]

- name: Сохранить бэкап локально
  ansible.builtin.copy:
    content: "{{ current_export.msg | to_nice_json(indent=2) if current_export.msg is defined else '# export failed' }}"
    dest: "{{ playbook_dir }}/../{{ baseline_dir }}/../backups/{{ inventory_hostname }}-{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -Iseconds')) }}.json"
    mode: "0644"
  delegate_to: localhost
  when: baseline_backup_before | bool and current_export is defined
  tags: [baseline, backup]

- name: Сгенерировать желаемый RSC из эталона
  ansible.builtin.template:
    src: golden.j2
    dest: "/tmp/{{ inventory_hostname }}-desired.rsc"
    mode: "0644"
  delegate_to: localhost
  when: baseline_stat.stat.exists
  tags: [baseline, gen]

- name: Показать diff (current vs desired) — dry-run
  ansible.builtin.debug:
    msg: "Diff для {{ inventory_hostname }}: сравните /tmp/{{ inventory_hostname }}-desired.rsc с экспортом ({{ current_export.msg | length if current_export.msg is defined else 0 }} записей)"
  when: baseline_stat.stat.exists
  tags: [baseline, diff]

- name: Импортировать эталонный конфиг (только с --tags apply и force)
  community.routeros.api:
    hostname: "{{ hostname | default(api_hostname) }}"
    username: "{{ username | default(api_username) }}"
    password: "{{ password | default(api_password) }}"
    port: "{{ api_port | default(8728) }}"
    path: "import"
    add: "file-name=ansible-baseline.rsc"
  when:
    - baseline_stat.stat.exists
    - "'apply' in ansible_run_tags"
    - baseline_apply_strategy == 'force'
  failed_when: false
  tags: [baseline, apply]

- name: Сообщение о safe-режиме
  ansible.builtin.debug:
    msg: |
      [SAFE] Эталон для {{ inventory_hostname }} сгенерирован в /tmp/{{ inventory_hostname }}-desired.rsc
      Для применения: ansible-playbook playbooks/04-baseline-apply.yml --tags apply
  when: "'apply' not in ansible_run_tags"
  tags: [baseline]

- name: Удалить временный файл
  ansible.builtin.file:
    path: "/tmp/{{ inventory_hostname }}-desired.rsc"
    state: absent
  delegate_to: localhost
  when: baseline_stat.stat.exists
  tags: [baseline]
