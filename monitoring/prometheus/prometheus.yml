global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: mikrotik
    location: lan-192.168.0.0/16

# Alertmanager (если нужен)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus сам
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Pushgateway — сюда Ansible пушит аудит-метрики
  - job_name: mikrotik_audit
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          group: mikrotik

  # snmp_exporter для роутеров (через SNMP)
  - job_name: mikrotik_snmp
    metrics_path: /snmp
    params:
      module: [mikrotik]
      target: ["192.168.0.50"]  # добавьте остальные gw-* через relabel или файл
    static_configs:
      - targets: ["snmp-exporter:9116"]
    relabel_configs:
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        target_label: __param_target
      - target_label: __address__
        replacement: snmp-exporter:9116

  # Node exporter для Debian 13 (хост Ansible 192.168.0.10)
  - job_name: node
    static_configs:
      - targets: ["192.168.0.10:9100"]

  # Blackbox — проверка API роутера (ICMP/TCP 8728)
  - job_name: mikrotik_api
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 192.168.0.50:8728
          - 192.168.0.50:8729
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # File SD для динамического инвентаря (генерируется Ansible)
  - job_name: mikrotik_file_sd
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/mikrotik.yml"]
        refresh_interval: 30s
