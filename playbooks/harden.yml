name: Харденинг и комплаенс
description: Аудит и усиление безопасности — firewall, сервисы, обновления

plays:
  - name: Отключение небезопасных сервисов
    hosts: all
    strategy: parallel
    tasks:
      - name: Disable telnet & ftp & www
        command: /ip service disable telnet,ftp,www
        tags: [harden, services]

      - name: Restrict winbox to LAN
        command: /ip service set winbox address=192.168.0.0/16,10.0.0.0/8
        tags: [harden]

      - name: SSH strong crypto only
        command: /ip ssh set strong-crypto=yes forwarding-enabled=no
        tags: [harden, ssh]

  - name: Firewall baseline
    hosts: edge
    tasks:
      - name: Input accept established
        command: /ip firewall filter add chain=input action=accept connection-state=established,related comment="rosctl: established"
        tags: [firewall]

      - name: Drop invalid
        command: /ip firewall filter add chain=input action=drop connection-state=invalid
        tags: [firewall]

      - name: Drop not from LAN
        command: /ip firewall filter add chain=input action=drop in-interface-list=!LAN comment="defconf: drop !LAN"
        tags: [firewall]

  - name: Обновления (dry-run по умолчанию)
    hosts: all
    tasks:
      - name: Check for updates
        command: /system/package/update check-for-updates
        tags: [update, check]

      - name: Show version
        command: /system/resource/print
        tags: [info]
