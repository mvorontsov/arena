name: WireGuard mesh
description: Разворачивает WireGuard туннели по шаблону Jinja2 на группу edge

plays:
  - name: WireGuard mesh для edge
    hosts: edge
    vars:
      wg_name: wg0
      wg_port: 13231
      wg_address: 10.255.0.{{ groups.edge.index(inventory_hostname) + 1 }}/24
    strategy: parallel
    parallel: 10
    tasks:
      - name: Создать WireGuard интерфейс (шаблон)
        template: wireguard.rsc.j2
        vars:
          wg_private_key: "Y29udGVudCBnZW5lcmF0ZWQgYnkgcm9zY3RsCg=="
          peers:
            - pubkey: "peer1-public-key-example=="
              allowed: "10.255.0.0/24"
              endpoint: "10.10.0.254:13231"
            - pubkey: "peer2-public-key-example=="
              allowed: "10.255.1.0/24"
              endpoint: "10.10.0.253:13231"
        tags: [wireguard, vpn]

      - name: Добавить маршрут через WG
        command: /ip route add dst-address=10.255.0.0/16 gateway={{ wg_name }} comment="rosctl wg-mesh"
        tags: [wireguard, routing]

      - name: Проверить WG статус
        command: /interface/wireguard/print
        tags: [wireguard, info]
