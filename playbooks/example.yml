name: Базовая настройка
description: Пример плейбука — DNS, NTP, identity, базовый firewall

plays:
  - name: Базовая сеть
    hosts: all
    vars:
      dns_primary: 1.1.1.1
      dns_secondary: 8.8.8.8
      ntp_server: pool.ntp.org
    strategy: parallel
    parallel: 20
    tasks:
      - name: Установить DNS
        command: /ip dns set servers={{ dns_primary }},{{ dns_secondary }} allow-remote-requests=yes
        tags: [dns, base]

      - name: Установить NTP
        command: /system ntp client set enabled=yes
        tags: [ntp, base]

      - name: Показать identity
        command: /system/identity/print
        tags: [info]

      - name: Проверить ресурсы
        command: /system/resource/print
        tags: [info, monitoring]

  - name: Безопасность (последовательно для prod)
    hosts: edge
    strategy: sequential
    tasks:
      - name: Отключить неиспользуемые сервисы
        command: /ip service disable [find name=telnet] ; /ip service disable [find name=ftp]
        tags: [harden, security]

      - name: Установить баннер
        command: /system note set show-at-login=yes note="Managed by rosctl — {{ inventory_hostname }}"
        tags: [banner]
