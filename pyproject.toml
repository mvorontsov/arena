[project]
name = "ros-orchestrator"
version = "0.2.0"
description = "Оркестратор для MikroTik RouterOS — CLI как Ansible + бэкапы, шаблоны, мониторинг, rollback"
readme = "README.md"
license = {text = "MIT"}
authors = [{name="Arena", email="hello@arena.ai"}]
keywords = ["mikrotik", "routeros", "orchestrator", "network", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
  "typer[all]>=0.12",
  "rich>=13.7",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "httpx>=0.27",
  "paramiko>=3.4",
  "rich-click>=1.8",
  "textual>=0.60",
  "apscheduler>=3.10",
  "sqlalchemy>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "cryptography>=42.0",
  "netaddr>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.3",
  "mypy>=1.9",
]

[project.urls]
Homepage = "https://github.com/mvorontsov/arena"
Documentation = "https://github.com/mvorontsov/arena#readme"
Repository = "https://github.com/mvorontsov/arena"

[project.scripts]
rosctl = "ros_orchestrator.cli:app"
ros-orchestrator = "ros_orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
