[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
timeout = 30
gathering = explicit
fact_caching = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout = 86400
stdout_callback = yaml
bin_ansible_callbacks = True
display_skipped_hosts = False
display_ok_hosts = True
roles_path = ./roles
collections_path = ./collections_installed:/usr/local/lib/python3.11/dist-packages/ansible_collections
retry_files_enabled = False
interpreter_python = auto_silent
force_valid_group_names = ignore
# vault_password_file отключен для стенда — раскомментируйте для прода
# vault_password_file = .vault_pass

[privilege_escalation]
become = False

[inventory]
enable_plugins = yaml, ini, auto
cache = True
cache_plugin = jsonfile
cache_connection = .cache/inventory
cache_timeout = 3600

[paramiko_connection]
record_host_keys = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
control_path_dir = .cache/cp
control_path = %(directory)s/%%h-%%p-%%r
